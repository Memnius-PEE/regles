# Workflow réutilisable : gardes du socle, appelées par chaque sujet
#   jobs:
#     gardes:
#       uses: Memnius-PEE/regles/.github/workflows/gardes.yml@v1
# Bloque la fusion si le socle n'est pas respecté (le ruleset du sujet exige ce contrôle, garde A1).
name: Gardes Memnius
on:
  workflow_call:
    inputs:
      socle:
        description: Étiquette du socle (dépôt regles)
        type: string
        default: v1
      registre:
        description: Étiquette de l'outil de registre (dépôt registre)
        type: string
        default: v1

permissions:
  contents: read

jobs:
  gardes:
    name: Gardes A2 à A6
    if: ${{ !github.event.repository.is_template }}   # le gabarit garde ses valeurs à remplacer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # A4 compare le journal au commit de base
          lfs: false       # A6 mesure les pointeurs LFS, pas les fichiers
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml jsonschema
      - name: Outils communs
        run: |
          git clone --quiet --depth 1 --branch "${{ inputs.socle }}" "https://github.com/${{ github.repository_owner }}/regles.git" /tmp/regles
          git clone --quiet --depth 1 --branch "${{ inputs.registre }}" "https://github.com/${{ github.repository_owner }}/registre.git" /tmp/registre
      - name: Gardes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 /tmp/regles/gardes/gardes.py --registre /tmp/registre --base "$BASE" .

  secrets:
    name: A2, second filet (gitleaks)
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm -v "$PWD:/depot" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /depot --no-banner --redact --verbose --log-opts="${BASE:+$BASE..}HEAD"
